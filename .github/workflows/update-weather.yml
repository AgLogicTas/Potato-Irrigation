name: Update weather data

# Runs automatically every day, and can also be run manually from the
# Actions tab (the "Run workflow" button) any time you want fresh numbers
# right now instead of waiting for the schedule.
on:
  schedule:
    # 20:00 UTC = 6/7am Hobart time (depending on daylight saving).
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch latest weather data
        run: python3 fetch_weather.py

      - name: Commit updated data.json
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "Update weather data"
          git push
